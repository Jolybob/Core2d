name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Restore Vite source entry
        run: cp index.vite.html index.html

      - name: Build
        run: npm run build

      - name: Verify Vite output
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -d dist/assets
          if grep -Eq 'src/[^[:space:]"'"']+\.(ts|tsx|css)' dist/index.html; then
            echo 'ERROR: dist/index.html still references raw source files.'
            cat dist/index.html
            exit 1
          fi
          echo 'Vite output verified.'

      - name: Publish built site to repository root
        run: |
          set -euo pipefail
          cp dist/index.html index.html
          rm -rf assets
          cp -R dist/assets assets
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets
          if git diff --cached --quiet; then
            echo 'Root Pages bundle is already current.'
            exit 0
          fi
          git commit -m 'chore: publish built Pages bundle'
          git push origin HEAD:main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
