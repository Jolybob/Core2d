name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Verify Vite output
        run: |
          test -f dist/index.html
          if grep -Eq "src/[^\"' ]+\\.(ts|tsx|css)" dist/index.html; then
            echo 'ERROR: dist/index.html still references source files.'
            cat dist/index.html
            exit 1
          fi
          if grep -Eq 'src/(ui|main|version|cozy-farm)\\.(ts|tsx|css)' dist/assets/*.js dist/assets/*.css 2>/dev/null; then
            echo 'ERROR: built assets still reference raw source modules.'
            exit 1
          fi
          echo 'Vite output verified: no raw TypeScript/CSS source imports in dist.'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
