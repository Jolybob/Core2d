<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101712" />
    <title>Core2D — Underground Survival</title>
    <style>
      html, body, #game { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #101712; }
      body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      canvas { display: block; }
      #core2d-loader-error { position: fixed; inset: 16px; z-index: 9999; display: grid; place-items: center; padding: 24px; box-sizing: border-box; border: 1px solid #e06c75; border-radius: 14px; background: #171c1aeF; color: #f4f7f3; font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "phaser": "https://cdn.jsdelivr.net/npm/phaser@4.2.1/dist/phaser.esm.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="game"></div>
    <script src="https://cdn.jsdelivr.net/npm/typescript@5.8.3/lib/typescript.min.js"></script>
    <script type="module">
      const BUILD_VERSION = '0.3.3';

      const showError = (error) => {
        const panel = document.createElement('pre');
        panel.id = 'core2d-loader-error';
        panel.textContent = `Core2D could not start.\n\n${error instanceof Error ? error.stack || error.message : String(error)}`;
        document.body.appendChild(panel);
      };

      const fetchText = async (path) => {
        const response = await fetch(path, { cache: 'no-store' });
        if (!response.ok) throw new Error(`Could not read ${path} (${response.status})`);
        return response.text();
      };

      const transpile = (source, fileName) => window.ts.transpileModule(source, {
        compilerOptions: {
          target: window.ts.ScriptTarget.ES2022,
          module: window.ts.ModuleKind.ESNext,
          moduleResolution: window.ts.ModuleResolutionKind.Bundler,
        },
        fileName,
      }).outputText;

      const toModuleUrl = (code) => URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));

      try {
        // Raw GitHub Pages/static hosting cannot resolve a relative import from a blob: URL.
        // Build both TypeScript modules explicitly, then make main.ts import the ui blob by URL.
        const [mainSourceRaw, uiSourceRaw, css] = await Promise.all([
          fetchText('./src/main.ts'),
          fetchText('./src/ui.ts'),
          fetchText('./src/ui.css'),
        ]);

        const mainSource = mainSourceRaw
          .replace(/0\.3\.0|0\.3\.1|0\.3\.2/g, BUILD_VERSION)
          .replace(/import\s+['"]\.\/ui['"];?/, '');
        const uiSource = uiSourceRaw
          .replace(/0\.3\.0|0\.3\.1|0\.3\.2/g, BUILD_VERSION)
          .replace(/import\s+['"]\.\/ui\.css['"];?/, '');

        const style = document.createElement('style');
        style.id = 'core2d-ui-css';
        style.textContent = css;
        document.head.appendChild(style);

        const uiUrl = toModuleUrl(transpile(uiSource, 'src/ui.ts'));
        const mainCode = transpile(`await import(${JSON.stringify(uiUrl)});\n${mainSource}`, 'src/main.ts');
        const mainUrl = toModuleUrl(mainCode);

        try {
          await import(mainUrl);
        } finally {
          URL.revokeObjectURL(mainUrl);
          URL.revokeObjectURL(uiUrl);
        }
      } catch (error) {
        console.error('[Core2D] startup failure', error);
        showError(error);
      }
    </script>
  </body>
</html>
