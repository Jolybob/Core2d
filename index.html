<script type="importmap">{"imports":{"phaser":"https://cdn.jsdelivr.net/npm/phaser@4.2.1/dist/phaser.esm.js"}}</script>
</head><body><div id="game"></div><script src="https://cdn.jsdelivr.net/npm/typescript@5.8.3/lib/typescript.min.js"></script><script type="module">
const BUILD_VERSION='0.3.7';
const showError=error=>{const panel=document.createElement('pre');panel.id='core2d-loader-error';panel.textContent=`Core2D could not start.\n\n${error instanceof Error?error.stack||error.message:String(error)}`;document.body.appendChild(panel)};
const fetchText=async path=>{const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw new Error(`Could not read ${path} (${r.status})`);return r.text()};
const transpile=(source,fileName)=>window.ts.transpileModule(source,{compilerOptions:{target:window.ts.ScriptTarget.ES2022,module:window.ts.ModuleKind.ESNext,moduleResolution:window.ts.ModuleResolutionKind.Bundler},fileName}).outputText;
const moduleUrl=code=>URL.createObjectURL(new Blob([code],{type:'text/javascript'}));
try{const [mainRaw,uiRaw,css]=await Promise.all([fetchText('./src/main.ts'),fetchText('./src/ui.ts'),fetchText('./src/ui.css')]);document.title=`v${BUILD_VERSION} — Core2D`;const uiSource=uiRaw.replace(/0\.3\.0|0\.3\.1|0\.3\.2|0\.3\.3|0\.3\.4|0\.3\.5|0\.3\.6/g,BUILD_VERSION).replace(/import\s+['"]\.\/ui\.css['"];?/,'');let mainSource=mainRaw.replace(/0\.3\.0|0\.3\.1|0\.3\.2|0\.3\.3|0\.3\.4|0\.3\.5|0\.3\.6/g,BUILD_VERSION).replace(/import\s+['"]\.\/ui['"];?/,'');
mainSource=mainSource.replace(/inventory: Partial<Record<ItemType, number>> = \{ wood: 6, berry: 2 \}/,'inventory: Partial<Record<ItemType, number>> = { wood: 10, ore: 6, berry: 2 }');
const style=document.createElement('style');style.textContent=css;document.head.appendChild(style);const uiUrl=moduleUrl(transpile(uiSource,'src/ui.ts'));const mainUrl=moduleUrl(transpile(`await import(${JSON.stringify(uiUrl)});\n${mainSource}`,'src/main.ts'));try{await import(mainUrl)}finally{URL.revokeObjectURL(mainUrl);URL.revokeObjectURL(uiUrl)}}catch(error){console.error('[Core2D] startup failure',error);showError(error)}
</script></body></html>
