<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#17120d" />
<title>v0.3.10 — Core2D</title>
<style>html,body,#game{margin:0;width:100%;height:100%;overflow:hidden;background:#17120d}body{font-family:Inter,ui-sans-serif,system-ui,sans-serif}canvas{display:block}#core2d-loader-error{position:fixed;inset:16px;z-index:9999;display:grid;place-items:center;padding:24px;box-sizing:border-box;border:2px solid #b85c48;border-radius:14px;background:#211914f2;color:#fff4df;font:14px/1.5 ui-monospace,monospace;white-space:pre-wrap}</style>
<script type="importmap">{"imports":{"phaser":"https://cdn.jsdelivr.net/npm/phaser@4.2.1/dist/phaser.esm.js"}}</script>
</head><body><div id="game"></div><script src="https://cdn.jsdelivr.net/npm/typescript@5.8.3/lib/typescript.min.js"></script><script type="module">
const BUILD_VERSION='0.3.10';
const showError=error=>{const panel=document.createElement('pre');panel.id='core2d-loader-error';panel.textContent=`Core2D could not start.\n\n${error instanceof Error?error.stack||error.message:String(error)}`;document.body.appendChild(panel)};
const fetchText=async path=>{const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw new Error(`Could not read ${path} (${r.status})`);return r.text()};
const transpile=(source,fileName)=>window.ts.transpileModule(source,{compilerOptions:{target:window.ts.ScriptTarget.ES2022,module:window.ts.ModuleKind.ESNext,moduleResolution:window.ts.ModuleResolutionKind.Bundler},fileName}).outputText;
const moduleUrl=code=>URL.createObjectURL(new Blob([code],{type:'text/javascript'}));
try{
 const [mainRaw,uiRaw,css]=await Promise.all([fetchText('./src/main.ts'),fetchText('./src/ui.ts'),fetchText('./src/ui.css')]);
 document.title=`v${BUILD_VERSION} — Core2D`;
 const uiSource=uiRaw.replace(/0\.3\.0|0\.3\.1|0\.3\.2|0\.3\.3|0\.3\.4|0\.3\.5|0\.3\.6|0\.3\.7|0\.3\.8|0\.3\.9/g,BUILD_VERSION).replace(/import\s+['"]\.\/ui\.css['"];?/,'');
 let mainSource=mainRaw.replace(/0\.3\.0|0\.3\.1|0\.3\.2|0\.3\.3|0\.3\.4|0\.3\.5|0\.3\.6|0\.3\.7|0\.3\.8|0\.3\.9/g,BUILD_VERSION).replace(/import\s+['"]\.\/ui['"];?/,'');
 mainSource=mainSource.replace(/inventory: Partial<Record<ItemType, number>> = \{ wood: 6, berry: 2 \}/,'inventory: Partial<Record<ItemType, number>> = { wood: 20, ore: 12, berry: 4 }');
 const uiUrl=moduleUrl(transpile(uiSource,'src/ui.ts'));const mainUrl=moduleUrl(transpile(mainSource,'src/main.ts'));
 const style=document.createElement('style');style.textContent=css+'\n#core-ui{z-index:1000!important}.ui-crafting.open,.ui-inventory.open,.ui-help.open{z-index:10000!important;pointer-events:auto!important}.ui-crafting.open .menu-card,.ui-crafting.open button,.ui-inventory.open .menu-card,.ui-inventory.open button,.ui-help.open button{pointer-events:auto!important;touch-action:manipulation}';document.head.appendChild(style);
 // UI capture bridge. This deliberately uses plain DOM delegation instead of a fragile generated regex.
 document.addEventListener('pointerdown',e=>{
   const el=e.target instanceof HTMLElement?e.target:null;if(!el)return;
   const recipe=el.closest('[data-recipe]');
   if(recipe){e.preventDefault();e.stopPropagation();const id=recipe.getAttribute('data-recipe');if(id)window.dispatchEvent(new CustomEvent('core2d:craft',{detail:{id}}));return;}
   const slot=el.closest('[data-slot]');
   if(slot){e.preventDefault();e.stopPropagation();const n=Number(slot.getAttribute('data-slot'));if(Number.isInteger(n))window.dispatchEvent(new CustomEvent('core2d:select',{detail:{slot:n}}));return;}
   const invItem=el.closest('[data-item]');
   if(invItem){e.preventDefault();e.stopPropagation();const item=invItem.getAttribute('data-item');const slots=['sword','wood','stone','ore','berry','torch'];const n=slots.indexOf(item||'');if(n>=0){window.dispatchEvent(new CustomEvent('core2d:select',{detail:{slot:n}}));document.querySelector('#ui-inventory')?.classList.remove('open');document.querySelector('#ui-inventory')?.setAttribute('aria-hidden','true')}return;}
 },true);
 await import(uiUrl);await import(mainUrl);
} catch(error){console.error('[Core2D] startup failure',error);showError(error)}
</script></body></html>
